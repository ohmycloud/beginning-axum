[package]
name = "beginning-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["json", "multipart", "macros", "tokio"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
dotenvy = "0.15"
reqwest = { version = "0.11", features = ["json"] }
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
